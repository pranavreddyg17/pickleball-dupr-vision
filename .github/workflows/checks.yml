name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install CPU inference dependencies
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: python -m ruff check duprvision scripts tests
      - run: python -m pytest -q
      - run: npm run test:edge
      - name: Check browser scripts
        run: find static scripts tests -name '*.mjs' -o -name '*.js' | xargs -n 1 node --check
